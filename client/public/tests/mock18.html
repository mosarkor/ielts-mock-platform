<script>
const PASSAGES = [{"tag": "Passage 1 · Q1–13", "title": "The history of the guitar", "subtitle": "An overview of the origins of the modern guitar", "paragraphs": [["A", "The earliest stringed instruments currently known to archaeologists are bowl harps. For millennia, people made bowl harps using, for example, tortoise shells as resonators, with a bent stick for a neck and one or more gut or silk strings. The world's museums contain many such harps from the ancient Sumerian, Babylonian, and Egyptian civilisations. Around 2500-2000 BC more advanced harps, such as the beautifully carved 11-stringed instrument found in the tomb of Queen Shub-Ad in ancient Mesopotamia, now modern day Iraq, started to appear."], ["B", "The tanbur* probably developed from the bowl harp. It was different from the bowl harp in that its neck was straightened out to allow the strings to be pressed down to create more notes. Tomb paintings and stone carvings in Egypt indicate that harps and tanburs – plus flutes and percussion instruments – were being played together 3,500-4,000 years ago. Archaeologists have also found many similar relics amongst the ruins of the ancient Mesopotamian civilisation. Many of these instruments have survived into modern times in almost unchanged form, for example folk instruments of the region such as the Turkish saz and Afghan panchtar."], ["C", "At 3,500 years old, the tanbur which belonged to the Egyptian singer Har-Mose is the earliest known example of this instrument. Har-Mose's tanbur had three strings and a plectrum suspended from the neck by a cord. The soundbox, which increased the volume, was made of beautifully polished cedarwood and covered in rawhide. It can be seen today at the Archaeological Museum in Cairo."], ["D", "In order to distinguish guitars from other stringed instruments, it is helpful to have a broad definition of the guitar. Music expert Dr Michael Kasha defines a guitar as having 'a long, fretted neck, flat wooden soundboard, ribs, and a flat back, most often with sides that curve inwards'. The oldest known visual representation of such an instrument is a stone carving at Alaca Huyuk in Turkey, which shows a 3,300-year-old instrument with a long neck and sides that clearly curve inwards."], ["E", "The name 'guitar' comes from the ancient Sanskrit word for 'string' – 'tar'. Many popular stringed instruments used in central Asia today have existed in an unchanged form for several thousand years, as shown by archaeological finds in the area. Many have names that end in 'tar', with a prefix indicating the number of strings, such as the doter, a two-stringed instrument found in Turkestan, and the Persian three-stringed setar and four-stringed charter. The Indian sitar almost certainly took its name from the setar, but over the centuries it evolved radically, following the Indians' own aesthetic and cultural ideals."], ["F", "Tanburs and harps spread around the ancient world with travellers, merchants and seamen. The earliest guitar-like instruments to arrive in Europe had, most often, four strings. Many such instruments, and variations with from three to five strings, can be seen in mediaeval illustrated manuscripts. They were also carved in stone in European churches and cathedrals, from the first century AD through until the 13th century."], ["G", "When the four-stringed Persian chartar arrived in Spain, however, it changed in form and construction, acquiring pairs of strings tuned to the same note instead of single strings. It became known as the chitarra. By the middle of the 14th century, the chitarra had become dominant, at least in most of Europe. The earliest known music for the eight-stringed chitarra was written in 16th-century Spain. The ten-string version first appeared in Italy at the same time, and gradually replaced the eight-stringed instrument. A further two strings first appeared in the 17th century, an innovation which guitar makers all over Europe quickly took up. However, this twelve-string arrangement gradually gave way to six single strings across the continent. The six-stringed guitar can thus be said to be a development of the twelve-string., rather than vice versa, as was thought previously."], ["H", "At the beginning of the 19th century, the present-day guitar began to take shape, although bodies were still fairly small and narrow-waisted. The modern classical guitar first appeared in its current form in the mid-19th century, when the Spanish guitar maker Antonio Torres increased the size of the body , altered its proportions, and introduced the revolutionary fan braced top**. His design radically increased the volume and improved the tone of the instrument, and very soon became the norm. This design has remained essentially unchanged to this day."], ["I", "At the time when Torres made his breakthrough. German immigrants to America – among them Christian Fredrich Martin – began making guitars with X-braced tops. Steel strings, which became widely available several decades later in the early 1900s, offered the promise of much louder guitar, but the increased tension was too much for the fan-braced top. The stronger X braced top proved equal to the job, and quickly became the industry standard."], ["J", "At the end of the 19th century, guitar manufacturer Orville Gibson added steel strings to a body constructed like a cello, a combination which produced more volume. The electric guitar was born when pickups were fitted to Hawaiian and jazz guitars in the late 1920s , but met with little success until 1936, when Gibson introduced its famous ES150 model. tanbur*: a long-necked stringed instrument with a small pear-shaped body fan-braced top**: a strengthening structure in the shape of a fan inserted into the soundbox"]]}, {"tag": "Passage 2 · Q14–26", "title": "Playing soccer", "subtitle": "Street soccer and organized youth soccer in the USA", "paragraphs": [["A", "Street soccer, as its name implies, is an informal variation of the sport, often played on the street, particularly in urban areas. There are many reasons for the widespread popularity of street soccer. Unlike youth soccer, its more formally organized counterpart, no large space is needed, and goal posts, corner markers, and marked lines, associated with the formal game, are typically absent, as are game officials or referees. Another attraction of street soccer is that it is played frequently and competitively, but does not necessarily require standard 11-a-side teams or fixed playing positions. Unlike in youth soccer, inexperienced street soccer players rarely learn from repetitive technical and tactical drills. Instead, they learn from their poor performance in competition, unconscious of the skills they are nonetheless developing, and without older adults or coaches present. Players learn without effort through playing the game, and soon attain an almost natural feeling for the sport."], ["B", "However, there are lots of cities in the world today where conditions are such that street soccer is no longer possible. Congested traffic now dominates where games were once played. Parks and open fields are used as hangouts for older teenagers with other interests. Add to this the requirement in many localities for official permits to use public spaces and the managed schedules that many young people have today, and spontaneous play of any kind is hard to imagine."], ["C", "In spite of all these obstacles, which are probably solvable in most instances, there is another sociological explanation of why in many places street soccer doesn't enjoy the same popularity it once did. In his book How Soccer Explains the World, US writer Franklin Foer observes: But for all the talk of freedom, the 1960s parenting style had a far less relaxed side too. Like the 1960s consumer movement which brought seat belts and airbags to cars, the (youth) soccer movement felt like it could create a set of ... regulations that would protect both the child's body and mind from damage. Soccer leagues like the one I played in as a child handed out 'participation' prizes to every player, no matter how few games his (or her) team won.... Where most of the world accepts the practice of using your head to hit the ball as an essential element of the game, some (youth) soccer parents have worried over the potential for injury to the brain. An entire industry grew up to manufacture protective headgear.... Even though very little medical evidence supports this fear, some youth leagues prohibited heading the ball altogether."], ["D", "A growing body of people don't believe street soccer involves a legitimate educational method. They argue that children need to be taught by experts. Youth soccer instruction now begins with four-year-olds, so that they will have an advantage as six- year-olds. This need to get ahead brings with it a fear of falling behind that only expert instruction can prevent. This type of instruction leaves no room for the trial and error approach of street soccer."], ["E", "One of the basic ideas of street soccer is that young players are assigned a particular role by a better player and are expected to play for the good of the team. Such an assignment runs counter to the idea of youth soccer that every child needs to learn every position and will benefit from doing so. In street soccer, you fill the role that you are best suited to at a particular time. While this role assignment can change from game to game, the purpose is always the same: to get the best out of each individual at any given moment."], ["F", "In street soccer, children have to learn patience, to wait their turn, to realize that they are not entitled to make decisions, or even be listened to simply because they show up. Positions of responsibility are earned through competition within the team. Younger players in street soccer must wait to attain those positions. In youth soccer, however, with its overly democratic values, youngsters are guaranteed their time in the spotlight. Whether it's their turn to be captain, to play a central position or to take a crucial shot, youth soccer players come to believe that hard work and patience aren't really necessary."], ["G", "Not only does every youth soccer player get a chance, it is assumed that each individual has played well. 'Everyone's a winner; no one's a loser' is a guiding principle of youth soccer. This ensures each individual goes away positive about themselves. No one can leave a game or a practice feeling bad. But, if there really are no losers, then why try at all? Since giving less than your best receives the same reward as giving your best why go to any extra effort? In street soccer, every game results in a winner and a loser and everyone knows who is who. Losing a game is a common experience and players learn early on how to handle this. As a result, unlike most youth soccer players, they acquire resilience. A further difference between these two strands of soccer is that in street soccer a formal record is not kept. You can lose one day and win the next. The results are only temporary and are forgotten within minutes of the end of the match. But in organized youth soccer, the position each person plays and the results are formally noted and maintained throughout a season."]]}, {"tag": "Passage 3 · Q27–40", "title": "The History of Chocolate", "subtitle": "From ancient Mesoamerican drink to global confectionery", "paragraphs": [["A", "Chocolate is now perceived as a ubiquitous indulgence, whether consumed as confectionery or a beverage, readily accessible in global markets. However, it may come as a surprise that chocolate was once regarded as a commodity of extraordinary value. The discovery of the cocoa tree, the source of chocolate, occurred approximately 2,000 years ago in the lush tropical rain forests of the Americas. The evolution of the chocolate — from a regionally significant Mesoamerican drink to globally consumed confectionery — has been shaped through cross continental cultural exchanges and the successive influences of multiple civilisations."], ["B", "Historians suggest that the ancient Maya pioneered cocoa tree cultivation in Mesoamerica, with evidence dating back approximately 2,000 years. They transplanted cocoa trees from the dense rain forest into their domesticated gardens, where cocoa beans were initially roasted and ground into a smooth paste. The paste was combined with spices and water to produce unsweetened chocolate beverages. The Maya also employed a distinctive technique of transferring the liquid back and forth between containers, generating a foamy layer on the drink's surface."], ["C", "Cocoa and chocolate were integral to Maya culture, commonly depicted in their architectural structures and artistic works. While the aristocracy, particularly the royal families, consumed chocolate during elaborate ceremonies, even less privileged groups occasionally savoured the drink. Furthermore, cocoa beans served as a powerful emblem of marital union and were ritually exchanged during wedding ceremonies."], ["D", "The Aztec civilisation in Mexico regarded chocolate as a prestigious commodity, despite being geographically unable to cultivate cocoa trees within their heartland. Accordingly, they sourced cocoa beans through extensive trade networks, even utilising them as currency for tax payments. Chocolate held an exclusive function within Aztec imperial and religious ceremonies, where priests offered cocoa beans as divine offerings and prepared sacred chocolate drinks. Due to the scarcity of cocoa beans, consumption remained restricted to the societal elite, with historical accounts suggesting Emperor Montezuma consumed up to 50 cups daily. Linguists trace the term 'chocolate' to the Aztec Nahuatl word xocolatl, meaning 'bitter water' in the Nahuatl language, though some scholars argue that it has hybrid origins combining Maya and Nahuatl linguistic elements."], ["E", "In 1502, explorer Christopher Columbus introduced cocoa beans to Spain after voyaging to Mesoamerica, and later Spanish explorer Hernán Cortés quickly recognised the potential economic value of chocolate. Upon arriving in present-day Mexico in 1519, Cortés observed that chocolate beverages would appeal to the Spanish. After conquering the Aztec Empire, Spanish forces exported confiscated cocoa supplies to Spain. In response to the growing demand, Spain began cultivating cocoa trees in its American colonies. Spanish elite first developed a taste for sweetened chocolate drinks, but the beverage rapidly spread across Europe. England, the Netherlands, and France followed suit by establishing cocoa plantations in their own colonies. By the 18th century, chocolate remained primarily a luxury restricted to the affluent. However, the Industrial Revolution's technologies enabled mechanised production, dramatically reducing costs and making chocolate available to a broader population."], ["F", "Cocoa trees are cultivated across multiple countries in Africa, Mesoamerica, and South America, thriving in cool, shaded environments within equatorial zones. Despite widespread cultivation, cocoa farming remains labour-intensive, due to the trees' requirement for specific water thresholds, temperature ranges, soil compositions, and protection from environmental threats. Approximately five years after planting, cocoa trees begin to yield large, pod-shaped fruits that grow on the trunk. These pods contain the beans used in chocolate production. While several types of cocoa trees exist, the bulk of the chocolate is produced from the seeds of the most commonly cultivated varieties. However, farmers opt to grow more specialised types, such as Criollo or Trinitario, valued for distinctive flavour profiles. Unexpectedly, cocoa trees grown on farms are more vulnerable to disease and pests than their wild counterparts. Cocoa cultivation presents a strenuous endeavour for farmers, who sell their harvests on futures markets. exposing their incomes to external market fluctuations."], ["G", "The process of chocolate production involves a series of steps, carried out in specialised factories where cocoa beans are meticulously processed. Workers first sort, clean, and roast the beans before extracting the outer shells, leaving only the inner nibs. These nibs I are then ground into a dense paste known as chocolate liquor, which is subsequently separated into two components: cocoa solids and cocoa butter. Following standardised formulations, chocolate manufacturers blend the chocolate liquor with precise ratios of sugar, milk, and cocoa butter. The resulting mixture, often referred to as the 'crumb', undergoes fine grinding to create a smooth consistency. Finally, the mixture is then subjected to two additional processes — conching and tempering — before being placed into moulds to create various forms, such as bars or other chocolate products."], ["H", "Chocolate holds significant global economic value, with the manufacturing industry generating over $5 billion annually from cocoa crops, and its reputation remains most prominent in Europe and the United States. For instance, US cocoa product imports reached $1.4 billion in 2005. On average, Americans consume over five kilogrammes of chocolate per person each year. In addition, upscale chocolate boutiques, which offer premium chocolates, have gained significant popularity. Many of these shops specialise in artisanal chocolates, crafted with unique flavour profiles. Renowned chocolate brands such as Cadbury, Godiva, Lindt, and Ferrero Rocher dominate the market. However, the cocoa and chocolate production sectors often face challenges related to fair trade, sustainable development, and environmental preservation. These issues are now being actively addressed by industry stakeholders, including officials, activists, and researchers, who are working closely with farmers to promote farming practices that foster sustainability and protect the environment."]]}];

let userAnswers = {}, multiAnswers = {}, submitted = false, timeLeft = 3600, timerRunning = true, currentSelection = null;
function esc(s){return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.max(0,s%60)).padStart(2,'0');}
let timerInt = setInterval(()=>{ if(timeLeft>0){timeLeft--; document.getElementById('timer-display').textContent=fmt(timeLeft);} },1000);
document.getElementById('timer-toggle').addEventListener('click', function(){ if(timerRunning){clearInterval(timerInt); this.textContent='▶';} else {timerInt=setInterval(()=>{ if(timeLeft>0){timeLeft--; document.getElementById('timer-display').textContent=fmt(timeLeft);} },1000); this.textContent='||';} timerRunning=!timerRunning;});

function renderPassages(){ const panel=document.getElementById('passage-panel'); panel.innerHTML=PASSAGES.map((p,idx)=>`<div class="passage-view ${idx===0?'active':''}" id="pv-${idx+1}"><div class="passage-eyebrow"><span class="eyebrow-tag">${esc(p.tag)}</span></div><h1 class="passage-title">${esc(p.title)}</h1><p class="passage-subtitle">${esc(p.subtitle)}</p><div class="passage-divider"></div><div class="passage-body">${p.paragraphs.map(([lab,txt])=>`<p>${lab?`<span class="para-label">${esc(lab)}</span>`:''}${esc(txt)}</p>`).join('')}</div></div>`).join(''); }
function renderItem(item){ if(item.type==='tf'){return `<div class="tf-card" id="card-${item.q}"><div class="tf-card-head"><span class="q-num-badge">${item.q}</span><span class="q-text">${esc(item.text)}</span></div><div class="tf-options">${item.options.map(o=>`<button class="tf-opt-btn" data-q="${item.q}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;} if(item.type==='mcq'){return `<div class="tf-card" id="card-${item.q}"><div class="tf-card-head"><span class="q-num-badge">${item.q}</span><span class="q-text">${esc(item.text)}</span></div>${item.options.map(([v,t])=>`<div class="mcq-option" data-q="${item.q}" data-val="${esc(v)}"><span class="opt-letter">${esc(v)}</span><span class="opt-text">${esc(t)}</span></div>`).join('')}</div>`;} if(item.type==='multi'){let key=item.qs.join('-');return `<div class="tf-card" id="card-${key}"><div class="tf-card-head"><span class="q-num-badge">${key}</span><span class="q-text">${esc(item.text)}</span></div>${item.options.map(([v,t])=>`<div class="mcq-option multi-option" data-key="${key}" data-max="${item.max}" data-val="${esc(v)}"><span class="opt-letter">${esc(v)}</span><span class="opt-text">${esc(t)}</span></div>`).join('')}</div>`;} if(item.type==='inputGroup'){return `<div class="input-card" id="group-${(item.rows[0]||{}).q}">${item.title?`<div class="input-title">${esc(item.title)}</div>`:''}${item.rows.map(r=>`<div class="input-card-row" id="card-${r.q}"><span class="q-num-badge">${r.q}</span><span class="q-text">${esc(r.before)}</span><input type="text" class="input-field" id="q${r.q}" data-q="${r.q}" autocomplete="off" spellcheck="false"><span class="q-text">${esc(r.after||'')}</span></div>`).join('')}</div>`;} return ''; }
function renderQuestions(){ const panel=document.getElementById('questions-panel'); panel.innerHTML=QUESTION_PARTS.map((part,idx)=>`<div class="questions-view ${idx===0?'active':''}" id="qv-${part.part}">${part.sections.map(sec=>`<div class="q-section-header"><span class="q-section-badge">${esc(sec.badge)}</span><span class="q-section-title">${esc(sec.title)}</span></div><div class="instruction-box">${esc(sec.instruction)}</div>${sec.items.map(renderItem).join('')}`).join('')}</div>`).join(''); attachEvents(); }
function renderPills(){document.getElementById('q-pills').innerHTML=Array.from({length:40},(_,i)=>`<div class="q-pill" id="pill-${i+1}" onclick="jumpToQ(${i+1})">${i+1}</div>`).join('');}
function attachEvents(){document.querySelectorAll('.tf-opt-btn').forEach(btn=>btn.addEventListener('click',()=>{if(submitted)return;let q=btn.dataset.q;document.querySelectorAll(`.tf-opt-btn[data-q="${q}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');userAnswers[q]=btn.dataset.val;updateProgress();}));document.querySelectorAll('.mcq-option:not(.multi-option)').forEach(opt=>opt.addEventListener('click',()=>{if(submitted)return;let q=opt.dataset.q;document.querySelectorAll(`.mcq-option[data-q="${q}"]`).forEach(o=>o.classList.remove('selected'));opt.classList.add('selected');userAnswers[q]=opt.dataset.val;updateProgress();}));document.querySelectorAll('.multi-option').forEach(opt=>opt.addEventListener('click',()=>{if(submitted)return;let key=opt.dataset.key,max=parseInt(opt.dataset.max);multiAnswers[key]=multiAnswers[key]||[];let v=opt.dataset.val;if(multiAnswers[key].includes(v)){multiAnswers[key]=multiAnswers[key].filter(x=>x!==v);opt.classList.remove('selected');}else{if(multiAnswers[key].length>=max)return;multiAnswers[key].push(v);opt.classList.add('selected');}updateProgress();}));document.querySelectorAll('.input-field').forEach(inp=>inp.addEventListener('input',()=>{userAnswers[inp.dataset.q]=inp.value.trim();updateProgress();}));}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'').trim();}
function isCorrect(q){let corr=CORRECT[q];let user=userAnswers[q]||'';if(Array.isArray(corr))return corr.some(c=>norm(c)===norm(user));return String(user)===String(corr);}function pairScore(key){let selected=multiAnswers[key]||[], corr=PAIR_CORRECT[key]||[];return selected.filter(v=>corr.includes(v)).length;}
function answeredCount(){let n=Object.keys(userAnswers).filter(k=>String(userAnswers[k]||'').trim()).length;Object.values(multiAnswers).forEach(a=>n+=a.length);return n;}
function updateProgress(){let ans=answeredCount();document.getElementById('progress-text').textContent=ans+'/40';document.getElementById('progress-footer').textContent=ans+'/40 Answered';document.getElementById('progress-bar-inner').style.width=(ans/40*100)+'%';for(let i=1;i<=40;i++){let p=document.getElementById('pill-'+i);let filled=!!(userAnswers[i]&&String(userAnswers[i]).trim());if(i===20||i===21)filled=(multiAnswers['20-21']||[]).length>=i-19;if(i===22||i===23)filled=(multiAnswers['22-23']||[]).length>=i-21;p.classList.toggle('answered',filled);}}
function switchPart(p){document.querySelectorAll('.passage-view,.questions-view').forEach(el=>el.classList.remove('active'));document.getElementById('pv-'+p).classList.add('active');document.getElementById('qv-'+p).classList.add('active');document.querySelectorAll('.part-tab').forEach((t,i)=>t.classList.toggle('active',i+1===p));}
function jumpToQ(q){let part=q<=13?1:q<=26?2:3;switchPart(part);setTimeout(()=>{let el=document.getElementById('card-'+q); if(q>=20&&q<=21)el=document.getElementById('card-20-21'); if(q>=22&&q<=23)el=document.getElementById('card-22-23'); if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50)}
function markUI(){for(let q=1;q<=40;q++){let p=document.getElementById('pill-'+q);if(q===20||q===21){let sc=pairScore('20-21');p.classList.add(sc===2?'correct':'incorrect');continue;}if(q===22||q===23){let sc=pairScore('22-23');p.classList.add(sc===2?'correct':'incorrect');continue;}let ok=isCorrect(q);p.classList.add(ok?'correct':'incorrect');let card=document.getElementById('card-'+q);if(card)card.classList.add(ok?'is-correct':'is-incorrect');}document.querySelectorAll('.input-field').forEach(inp=>inp.classList.add(isCorrect(inp.dataset.q)?'correct':'incorrect'));document.querySelectorAll('.tf-opt-btn').forEach(btn=>{let q=btn.dataset.q,c=CORRECT[q];if(btn.dataset.val===c)btn.classList.add('correct-sel');else if(btn.classList.contains('selected'))btn.classList.add('incorrect-sel');btn.disabled=true;});document.querySelectorAll('.mcq-option:not(.multi-option)').forEach(opt=>{let q=opt.dataset.q,c=CORRECT[q];if(opt.dataset.val===c)opt.classList.add('correct-opt');else if(opt.classList.contains('selected'))opt.classList.add('incorrect-opt');opt.classList.add('locked');});document.querySelectorAll('.multi-option').forEach(opt=>{let corr=PAIR_CORRECT[opt.dataset.key];if(corr.includes(opt.dataset.val))opt.classList.add('correct-opt');else if(opt.classList.contains('selected'))opt.classList.add('incorrect-opt');opt.classList.add('locked');});}
function submitTest(){if(submitted){document.getElementById('results-modal').classList.add('open');return;}submitted=true;let score=0, html='';for(let q=1;q<=40;q++){if(q===20){let sc=pairScore('20-21');score+=sc;html+=`<div class="result-row"><span class="r-num">20-21</span><span class="r-user">${esc((multiAnswers['20-21']||[]).join(', ')||'—')}</span><span class="r-corr">${PAIR_CORRECT['20-21'].join(', ')}</span><span class="r-badge ${sc===2?'ok':'bad'}">${sc}/2</span></div>`;q=21;continue;}if(q===22){let sc=pairScore('22-23');score+=sc;html+=`<div class="result-row"><span class="r-num">22-23</span><span class="r-user">${esc((multiAnswers['22-23']||[]).join(', ')||'—')}</span><span class="r-corr">${PAIR_CORRECT['22-23'].join(', ')}</span><span class="r-badge ${sc===2?'ok':'bad'}">${sc}/2</span></div>`;q=23;continue;}let ok=isCorrect(q);if(ok)score++;let corr=Array.isArray(CORRECT[q])?CORRECT[q][0]:CORRECT[q];html+=`<div class="result-row"><span class="r-num">${q}</span><span class="r-user">${esc(userAnswers[q]||'—')}</span><span class="r-corr">${esc(corr)}</span><span class="r-badge ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span></div>`;}document.getElementById('score-big').textContent=score;document.getElementById('results-content').innerHTML=html;document.getElementById('results-modal').classList.add('open');document.getElementById('submit-btn').classList.add('result-mode');document.getElementById('submit-btn').textContent='Results';markUI();}
document.getElementById('submit-btn').addEventListener('click',submitTest);document.getElementById('modal-close').addEventListener('click',()=>document.getElementById('results-modal').classList.remove('open'));
